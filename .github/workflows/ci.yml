name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest aiohttp
      - run: python -m compileall -q __init__.py nodes.py queue_service.py
      - run: python tests/run_unit_tests.py
      - run: node --check web/main.js
      - run: node --test tests/frontend/*.test.mjs
